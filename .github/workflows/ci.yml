name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.9.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scripts compile
        run: |
          python3 -m py_compile run.py sentinel/*.py

      - name: Smoke-test CLI help
        run: |
          python3 run.py --help || true

      - name: Lint with flake8
        run: |
          pip install flake8
          find . -name "*.py" -not -path "*/__pycache__/*" -print0 | xargs -0 flake8 --max-line-length=120 --ignore=E501,W503,W504,E203,E266,W505 || true
